<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de LED - ESP32</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      min-width: 280px;
    }
    .btn {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      transition: background-color 0.3s;
      width: 100%;
      user-select: none;
    }
    .btn-off { background-color: #e74c3c; } /* Vermelho */
    .btn-on { background-color: #2ecc71; }  /* Verde */
    #status {
      margin-top: 15px;
      font-size: 16px;
      color: #555;
    }
  </style>

  <!-- SDKs Compat do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="card">
    <h2>Controle de LED via ESP32</h2>
    <button id="toggleBtn" class="btn btn-off">LIGAR</button>
    <div id="status">Estado atual: DESLIGADO</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBMQndhZQ-zYipDO-j3C6Ep2_WCfByMWl0",
      authDomain: "casa-adaptada.firebaseapp.com",
      databaseURL: "https://casa-adaptada-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "casa-adaptada",
      storageBucket: "casa-adaptada.firebasestorage.app",
      messagingSenderId: "1009317352215",
      appId: "1:1009317352215:web:2de4d3e3008727b2eadd52",
      measurementId: "G-Z7HTXW85H1"
    };

    let estadoAtual = 0;
    let ledRef = null;

    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        ledRef = database.ref('led_status');

        // Escuta mudanças em tempo real no banco
        ledRef.on('value', (snapshot) => {
          const val = snapshot.val();
          estadoAtual = (val === 1 || val === "1") ? 1 : 0;
          atualizarInterface(estadoAtual);
        });
      }
    } catch (erro) {
      console.error("Erro ao conectar com o Firebase:", erro);
      document.getElementById('status').textContent = "Erro na configuração do Firebase";
    }

    // Escutador direto de clique no botão
    const btn = document.getElementById('toggleBtn');
    btn.addEventListener('click', () => {
      // Inverte o estado (0 vira 1, 1 vira 0)
      estadoAtual = estadoAtual === 1 ? 0 : 1;

      // 1. Atualiza a tela imediatamente ao clicar
      atualizarInterface(estadoAtual);

      // 2. Grava no Firebase Realtime Database
      if (ledRef) {
        ledRef.set(estadoAtual).catch((err) => {
          console.error("Erro ao gravar no Firebase:", err);
        });
      }
    });

    function atualizarInterface(estado) {
      const statusText = document.getElementById('status');
      if (estado === 1) {
        btn.textContent = 'DESLIGAR';
        btn.className = 'btn btn-on';
        statusText.textContent = 'Estado atual: LIGADO';
      } else {
        btn.textContent = 'LIGAR';
        btn.className = 'btn btn-off';
        statusText.textContent = 'Estado atual: DESLIGADO';
      }
    }
  </script>
</body>
</html>
